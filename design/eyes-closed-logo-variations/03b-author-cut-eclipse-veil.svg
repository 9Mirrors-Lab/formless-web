<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Eyes Closed author cut B - eclipse veil</title>
  <desc id="desc">A dark eclipse form crossed by a closed-eye crescent, surrounded by quiet particle veils.</desc>
  <defs>
    <style>
      .bg{fill:#050806}.cream{fill:#f2f0e9}.sage{fill:#9fb5aa}.ember{fill:#cc5833}
      .ring{fill:none;stroke:#f2f0e9;stroke-opacity:.16;stroke-width:1}
      .dot{fill:none;stroke-linecap:round;stroke-dasharray:0 8}
      .word{font-family:"Didot","Bodoni 72","Baskerville","Times New Roman",serif;font-size:70px;font-weight:400;letter-spacing:1.2px}
      .tag{font-family:"Space Mono","Courier New",monospace;font-size:10px;letter-spacing:6px}
    </style>
    <radialGradient id="bHalo" cx="50%" cy="48%" r="52%">
      <stop offset="0" stop-color="#f2f0e9" stop-opacity=".22"/>
      <stop offset=".34" stop-color="#f2f0e9" stop-opacity=".06"/>
      <stop offset=".7" stop-color="#9fb5aa" stop-opacity=".08"/>
      <stop offset="1" stop-color="#050806" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect class="bg" width="1120" height="520"/>
  <circle cx="560" cy="180" r="128" fill="url(#bHalo)"/>
  <circle cx="560" cy="180" r="104" fill="#050806"/>
  <circle cx="560" cy="180" r="128" class="ring"/>
  <circle cx="560" cy="180" r="156" class="ring"/>
  <path class="cream" d="M365 194 C465 254 650 254 757 194 C647 235 468 236 365 194 Z"/>
  <path class="dot" d="M305 154 C448 46 697 44 858 142" stroke="#9fb5aa" stroke-opacity=".42" stroke-width="2.2"/>
  <path class="dot" d="M342 206 C480 181 665 180 824 209" stroke="#f2f0e9" stroke-opacity=".42" stroke-width="2.4"/>
  <path class="dot" d="M438 102 C520 52 655 36 766 72" stroke="#cc5833" stroke-opacity=".38" stroke-width="1.4"/>
  <g>
    <circle class="cream" cx="415" cy="198" r="2"/><circle class="sage" cx="482" cy="176" r="1.3"/><circle class="cream" cx="559" cy="166" r="2.8"/><circle class="cream" cx="650" cy="175" r="1.6"/><circle class="ember" cx="732" cy="72" r="1.6"/>
  </g>
  <text x="560" y="390" text-anchor="middle" class="cream word">Eyes Closed</text>
  <text x="560" y="429" text-anchor="middle" class="sage tag">RETURN TO THE CENTER</text>
</svg>
