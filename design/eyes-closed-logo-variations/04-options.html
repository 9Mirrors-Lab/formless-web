<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Eyes Closed — 04 Logo Options</title>
    <style>
      :root {
        color-scheme: dark;
        --void: #050806;
        --cream: #f2f0e9;
        --sage: #9fb5aa;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--void);
        color: var(--cream);
        font-family: "Space Mono", "Courier New", monospace;
      }
      main {
        width: min(1440px, calc(100% - 48px));
        margin: 0 auto;
        padding: 38px 0 56px;
      }
      header {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 24px;
        align-items: end;
        border-bottom: 1px solid rgb(242 240 233 / .16);
        padding-bottom: 20px;
        margin-bottom: 18px;
      }
      h1 {
        margin: 0;
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: clamp(48px, 8vw, 112px);
        font-weight: 400;
        line-height: .9;
        letter-spacing: 0;
      }
      .note {
        max-width: 560px;
        margin: 0;
        color: rgb(242 240 233 / .7);
        font-size: 12px;
        line-height: 1.7;
        letter-spacing: .08em;
        text-transform: uppercase;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        margin-top: 16px;
      }
      article {
        border: 1px solid rgb(242 240 233 / .14);
        background: rgb(255 255 255 / .012);
        min-width: 0;
      }
      .meta {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 16px;
        color: rgb(242 240 233 / .72);
        font-size: 11px;
        letter-spacing: .18em;
        text-transform: uppercase;
        border-bottom: 1px solid rgb(242 240 233 / .1);
      }
      iframe {
        display: block;
        width: 100%;
        height: 260px;
        border: 0;
        background: var(--void);
      }
      .wide { grid-column: 1 / -1; }
      .wide iframe { height: 340px; }
      @media (max-width: 820px) {
        main { width: min(100% - 28px, 720px); padding-top: 26px; }
        header, .grid { grid-template-columns: 1fr; }
        iframe, .wide iframe { height: 235px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Eyes Closed</h1>
        <p class="note">Selected 04 direction only. Same mark and wordmark, exploring the lower tagline treatment.</p>
      </header>
      <section class="grid" aria-label="Selected 04 logo options">
        <article class="wide">
          <div class="meta"><span>04G</span><span>No Tagline</span></div>
          <iframe title="No tagline lockup" src="04g-tagline-none.svg"></iframe>
        </article>
        <article>
          <div class="meta"><span>04H</span><span>Begin With A Reflection</span></div>
          <iframe title="Begin with a reflection tagline lockup" src="04h-tagline-begin-reflection.svg"></iframe>
        </article>
        <article>
          <div class="meta"><span>04I</span><span>Inner Awareness</span></div>
          <iframe title="Inner awareness tagline lockup" src="04i-tagline-inner-awareness.svg"></iframe>
        </article>
        <article>
          <div class="meta"><span>04J</span><span>Return To Presence</span></div>
          <iframe title="Return to presence rule tagline lockup" src="04j-tagline-return-presence-rule.svg"></iframe>
        </article>
        <article>
          <div class="meta"><span>04K</span><span>Stop Pause Notice</span></div>
          <iframe title="Stop Pause Notice tagline lockup" src="04k-tagline-stop-pause-notice.svg"></iframe>
        </article>
        <article class="wide">
          <div class="meta"><span>04L</span><span>Quiet Space For Inner Awareness</span></div>
          <iframe title="Quiet space for inner awareness tagline lockup" src="04l-tagline-quiet-space.svg"></iframe>
        </article>
      </section>
    </main>
  </body>
</html>
