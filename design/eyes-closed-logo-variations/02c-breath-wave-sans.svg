<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
  <title id="title">Eyes Closed dynamic variation C - breath wave sans</title>
  <desc id="desc">A crescent eyelid with a deep breath-like dotted wave field and humanist sans lockup.</desc>
  <defs>
    <style>
      .bg{fill:#050806}.cream{fill:#f2f0e9}.sage{fill:#9fb5aa}.ember{fill:#cc5833}.word{font-family:"Optima","Avenir Next","Helvetica Neue",Arial,sans-serif;font-size:48px;font-weight:400;letter-spacing:2.4px}.tag{font-family:"Space Mono","Courier New",monospace;font-size:10px;letter-spacing:5.8px}.dotline{fill:none;stroke-linecap:round;stroke-dasharray:0 7.5}
    </style>
  </defs>
  <rect class="bg" width="1100" height="420"/>
  <g>
    <path class="cream" d="M264 140 C392 205 585 205 716 140 C589 187 390 188 264 140 Z"/>
