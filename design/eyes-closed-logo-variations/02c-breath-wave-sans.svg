    <path class="dotline" d="M582 178 C702 202 806 223 984 210" stroke="#cc5833" stroke-opacity=".36" stroke-width="1.6"/>
    <g><circle class="cream" cx="690" cy="134" r="2.8"/><circle class="cream" cx="740" cy="150" r="1.5"/><circle class="sage" cx="802" cy="168" r="1.8"/><circle class="cream" cx="884" cy="180" r="1.2"/><circle class="ember" cx="949" cy="207" r="1.5"/></g>
  </g>
  <text x="550" y="306" text-anchor="middle" class="cream word">EYES CLOSED</text>
