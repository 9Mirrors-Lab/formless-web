<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Export 3b Dusk Announcement</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; background: #000; }
    .grain { position:absolute; inset:0; background-image:url("./assets/grain.png"); background-size:400px 400px; pointer-events:none; }
  </style>
</head>
<body>
  <div id="export" style="position:relative; width:3840px; height:2160px; overflow:hidden; background:#1a100a;">
    <img src="./assets/imagery/desert-dusk.jpg" alt="" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0.75;">
    <div style="position:absolute; inset:0; background:linear-gradient(180deg, rgba(8,6,4,0.88) 0%, rgba(8,6,4,0.4) 18%, rgba(8,6,4,0.15) 40%, rgba(8,6,4,0.3) 100%);"></div>
    <div class="grain" style="opacity:0.08; mix-blend-mode:soft-light;"></div>

    <div style="position:absolute; top:0; left:0; right:0; height:392px; display:flex; align-items:center; padding:0 160px;">
      <div style="display:flex; align-items:center; gap:36px;">
        <img src="./assets/logo/eyes-closed-logo-white.svg" alt="Eyes Closed" style="width:420px; height:auto;">
      </div>
      <div style="flex:1;"></div>
      <div style="display:flex; flex-direction:column; align-items:flex-end; gap:16px;">
        <div style="font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:300; font-size:104px; color:#f2f0e9; line-height:1;">Formless</div>
        <div style="font-family:'Plus Jakarta Sans',sans-serif; font-weight:600; font-size:28px; letter-spacing:0.28em; text-transform:uppercase; color:#cc5833;">Arriving September 1, 2026</div>
      </div>
    </div>

    <div style="position:absolute; right:160px; bottom:192px; width:820px;">
      <div style="box-sizing:border-box; display:flex; flex-direction:column; align-items:flex-start; gap:24px; padding:8px 0 8px 56px; border-left:1.5px solid rgba(242,240,233,0.32);">
        <div style="font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:300; font-size:52px; color:rgba(242,240,233,0.9); line-height:1.1; letter-spacing:0.005em; white-space:nowrap;">Something is arriving.</div>
        <div style="font-family:'Plus Jakarta Sans',sans-serif; font-weight:600; font-size:20px; letter-spacing:0.28em; text-transform:uppercase; color:rgba(242,240,233,0.42); white-space:nowrap;">A book by Sonika Cottman</div>
      </div>
    </div>
  </div>
</body>
</html>
