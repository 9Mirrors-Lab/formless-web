<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Export 2b Ghost Type</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; background: #000; }
    .grain { position:absolute; inset:0; background-image:url("./assets/grain.png"); background-size:400px 400px; pointer-events:none; }
  </style>
</head>
<body>
  <div id="export" style="position:relative; width:3840px; height:2160px; overflow:hidden; background:#080a09;">
    <div class="grain" style="opacity:0.08; mix-blend-mode:soft-light;"></div>
    <div style="position:absolute; top:50%; right:-180px; transform:translateY(-50%); font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:300; font-size:720px; color:#f2f0e9; opacity:0.045; line-height:1; white-space:nowrap; pointer-events:none;">Formless</div>
    <div style="position:absolute; top:0; left:0; width:42%; height:100%; background:linear-gradient(90deg, rgba(8,10,9,0.96) 60%, rgba(8,10,9,0) 100%);"></div>

    <!-- Logo at top-left. Lockup dropped by φ × logo height (~305px) so Formless sits on the upper golden section (H × φ⁻² ≈ 825). -->
    <div style="position:absolute; top:220px; left:260px; display:flex; flex-direction:column; align-items:flex-start; max-width:960px;">
      <img src="./assets/logo/eyes-closed-logo-white.svg" alt="Eyes Closed" style="width:504px; height:auto; display:block;">

      <div style="margin-top:305px; display:flex; flex-direction:column; gap:40px;">
        <div style="display:flex; flex-direction:column; gap:28px;">
          <div style="font-family:'Plus Jakarta Sans',sans-serif; font-weight:600; font-size:22px; letter-spacing:0.32em; text-transform:uppercase; color:rgba(242,240,233,0.42);">A book by Sonika Cottman</div>
          <div style="font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:300; font-size:148px; color:#f2f0e9; line-height:0.92; letter-spacing:-0.02em; white-space:nowrap;">Formless</div>
        </div>
        <div style="display:flex; flex-direction:column; gap:22px; max-width:720px;">
          <div style="width:56px; height:1.5px; background:rgba(242,240,233,0.28);"></div>
          <div style="font-family:'Plus Jakarta Sans',sans-serif; font-weight:600; font-size:24px; letter-spacing:0.26em; text-transform:uppercase; color:#cc5833;">Arriving September 1, 2026</div>
          <div style="font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:300; font-size:44px; color:rgba(242,240,233,0.58); line-height:1.2; letter-spacing:0.01em; white-space:nowrap;">Something is arriving.</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
