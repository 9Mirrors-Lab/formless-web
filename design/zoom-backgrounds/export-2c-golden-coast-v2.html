<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Export 2c Golden Coast v2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; background: #000; }
    .grain { position:absolute; inset:0; background-image:url("./assets/grain.png"); background-size:400px 400px; pointer-events:none; }
    .type {
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      font-style: normal;
      text-shadow: 0 2px 14px rgba(0,0,0,0.78), 0 0 34px rgba(0,0,0,0.48);
    }
  </style>
</head>
<body>
  <div id="export" style="position:relative; width:3840px; height:2160px; overflow:hidden; background:#1a0e08;">
    <img src="./assets/imagery/sunset-coast.jpg" alt="" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover;">
    <div style="position:absolute; inset:0; background:linear-gradient(180deg, rgba(8,6,4,0.82) 0%, rgba(8,6,4,0.2) 22%, rgba(8,6,4,0.05) 50%, rgba(8,6,4,0.45) 100%);"></div>
    <div class="grain" style="opacity:0.08; mix-blend-mode:soft-light;"></div>

    <div style="position:absolute; top:0; left:0; right:0; height:420px; display:flex; align-items:center; padding:0 260px;">
      <div style="display:flex; align-items:center; gap:36px; flex:1;">
        <img src="./assets/logo/eyes-closed-logo-white.svg" alt="Eyes Closed" style="width:624px; height:auto; filter:drop-shadow(0 4px 18px rgba(0,0,0,0.55));">
      </div>
      <div style="display:flex; flex-direction:column; align-items:flex-end; gap:14px;">
        <div class="type" style="font-weight:700; font-size:34px; letter-spacing:0.08em; text-transform:uppercase; color:rgba(242,240,233,0.65);">A book by Sonika Cottman</div>
        <div class="type" style="font-weight:800; font-size:38px; letter-spacing:0.06em; text-transform:uppercase; color:#cc5833;">Formless · Arriving September 1</div>
      </div>
    </div>

    <div style="position:absolute; bottom:220px; right:260px; max-width:1500px; text-align:right;">
      <div class="type" style="font-weight:600; font-size:72px; color:rgba(242,240,233,0.94); line-height:1.15; letter-spacing:-0.01em;">Formless takes you within to<br>discover what exists beyond your thoughts.</div>
    </div>
  </div>
</body>
</html>
