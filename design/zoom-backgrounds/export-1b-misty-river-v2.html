<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Export 1b Misty River v2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; background: #000; }
    .grain {
      position: absolute;
      inset: 0;
      background-image: url("./assets/grain.png");
      background-size: 400px 400px;
      pointer-events: none;
    }
    .eyebrow {
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      text-transform: uppercase;
      font-weight: 700;
      text-shadow: 0 2px 10px rgba(0,0,0,0.75), 0 0 28px rgba(0,0,0,0.5);
    }
    .teach {
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      font-style: normal;
      font-weight: 600;
      line-height: 1.15;
      text-shadow: 0 2px 14px rgba(0,0,0,0.78), 0 0 36px rgba(0,0,0,0.45);
    }
  </style>
</head>
<body>
  <div id="export" style="position:relative; width:3840px; height:2160px; overflow:hidden; background:#0e1512;">
    <img src="./assets/imagery/misty-river.jpg" alt="" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover;">
    <div style="position:absolute; inset:0; background:linear-gradient(90deg, rgba(8,10,9,0.88) 0%, rgba(8,10,9,0.55) 28%, rgba(8,10,9,0.18) 52%, rgba(8,10,9,0.4) 100%);"></div>
    <div style="position:absolute; inset:0; background:linear-gradient(0deg, rgba(8,10,9,0.72) 0%, rgba(8,10,9,0.15) 38%, rgba(8,10,9,0) 55%);"></div>
    <div class="grain" style="opacity:0.09; mix-blend-mode:soft-light;"></div>

    <img src="./assets/logo/eyes-closed-logo-white.svg" alt="Eyes Closed" style="position:absolute; top:240px; left:260px; width:672px; height:auto; filter:drop-shadow(0 4px 18px rgba(0,0,0,0.6));">

    <div style="position:absolute; left:260px; bottom:260px; max-width:1100px; display:flex; flex-direction:column; gap:24px;">
      <div class="eyebrow" style="font-size:40px; letter-spacing:0.08em; color:#cc5833;">Formless</div>
      <div class="teach" style="font-size:84px; color:rgba(242,240,233,0.95);">Remembering who you are<br>beyond the mind.</div>
    </div>
  </div>
</body>
</html>
