<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Export 1d Moss Editorial v2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; background: #000; }
    .grain {
      position: absolute;
      inset: 0;
      background-image: url("./assets/grain.png");
      background-size: 400px 400px;
      pointer-events: none;
    }
    .type {
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      font-style: normal;
      text-shadow: 0 2px 12px rgba(0,0,0,0.55), 0 0 28px rgba(0,0,0,0.35);
    }
  </style>
</head>
<body>
  <div id="export" style="position:relative; width:3840px; height:2160px; overflow:hidden; display:flex; background:#080a09;">
    <div class="grain" style="opacity:0.1; mix-blend-mode:soft-light; z-index:4;"></div>

    <div style="position:relative; width:1380px; height:100%; flex-shrink:0; background:#2e4036; overflow:hidden; z-index:2;">
      <div style="position:absolute; inset:0; background:radial-gradient(90% 55% at 50% 0%, rgba(159,181,170,0.18) 0%, transparent 70%);"></div>

      <div style="position:absolute; top:128px; left:108px; display:flex; flex-direction:column; gap:20px;">
        <img src="./assets/logo/eyes-closed-logo-arc-white.svg" alt="" style="width:408px; height:auto; display:block; filter:drop-shadow(0 3px 14px rgba(0,0,0,0.45));">
        <span class="type" style="font-weight:700; font-size:56px; color:rgba(242,240,233,0.92); line-height:1; letter-spacing:0.02em;">Eyes Closed</span>
      </div>

      <div style="position:absolute; left:108px; top:500px; display:flex; flex-direction:column; gap:12px; max-width:1160px;">
        <div class="type" style="font-weight:700; font-size:72px; color:#f2f0e9; line-height:1.1; letter-spacing:-0.01em;">
          What you’re searching for
        </div>
        <div class="type" style="font-weight:700; font-size:72px; color:#f2f0e9; line-height:1.1; letter-spacing:-0.01em;">
          has never been missing.
        </div>
      </div>

      <div style="position:absolute; left:108px; bottom:140px; right:100px; display:flex; flex-direction:column; gap:0;">
        <div style="width:80px; height:3px; background:#cc5833; margin-bottom:36px;"></div>

        <div style="display:flex; flex-direction:column; gap:18px; border-left:3px solid rgba(204,88,51,0.45); padding-left:36px;">
          <div class="type" style="font-weight:800; font-size:68px; letter-spacing:0.04em; text-transform:uppercase; color:#f2f0e9; line-height:1;">Formless</div>

          <div class="type" style="font-weight:700; font-size:30px; letter-spacing:0.08em; text-transform:uppercase; color:#cc5833; line-height:1.35;">
            Coming September 1, 2026
          </div>

          <div class="type" style="font-weight:600; font-size:34px; color:rgba(242,240,233,0.72); line-height:1.3; max-width:980px; letter-spacing:0;">
            An invitation to discover who you are beyond thought
          </div>

          <div class="type" style="font-weight:600; font-size:26px; letter-spacing:0.08em; text-transform:uppercase; color:rgba(242,240,233,0.42); line-height:1.4; margin-top:8px;">
            A book by Sonika Cottman
          </div>
        </div>
      </div>
    </div>

    <div style="flex:1; position:relative; background:
      radial-gradient(ellipse 55% 45% at 62% 28%, rgba(159,181,170,0.07) 0%, transparent 70%),
      radial-gradient(ellipse 80% 60% at 50% 100%, rgba(46,64,54,0.18) 0%, transparent 55%),
      #080a09; overflow:hidden;">
    </div>
  </div>
</body>
</html>
