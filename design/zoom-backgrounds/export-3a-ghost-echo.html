<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Export 3a Ghost Echo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; background: #000; }
    .grain { position:absolute; inset:0; background-image:url("./assets/grain.png"); background-size:400px 400px; pointer-events:none; }
  </style>
</head>
<body>
  <!-- Brother of 2b Ghost Type: same charcoal type world; inverted gravity + vertical ghost -->
  <div id="export" style="position:relative; width:3840px; height:2160px; overflow:hidden; background:#080a09;">
    <div class="grain" style="opacity:0.08; mix-blend-mode:soft-light;"></div>

    <!-- Vertical ghost along the right edge (2b runs horizontal) -->
    <div style="position:absolute; top:120px; right:100px; bottom:120px; width:420px; display:flex; align-items:center; justify-content:flex-end; pointer-events:none;">
      <div style="font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:300; font-size:520px; color:#f2f0e9; opacity:0.04; line-height:0.85; writing-mode:vertical-rl; text-orientation:mixed; letter-spacing:-0.03em; white-space:nowrap;">Formless</div>
    </div>

    <!-- Soft right veil so the vertical ghost stays at the margin; center stays clear -->
    <div style="position:absolute; top:0; right:0; width:38%; height:100%; background:linear-gradient(270deg, rgba(8,10,9,0.92) 35%, rgba(8,10,9,0) 100%);"></div>
    <div style="position:absolute; top:0; left:0; width:36%; height:100%; background:linear-gradient(90deg, rgba(8,10,9,0.55) 0%, rgba(8,10,9,0) 100%);"></div>

    <!-- Logo stays top-left -->
    <div style="position:absolute; top:220px; left:260px;">
      <img src="./assets/logo/eyes-closed-logo-white.svg" alt="Eyes Closed" style="width:420px; height:auto; display:block;">
    </div>

    <!-- Book lockup bottom-left (2b carries it mid-frame); same 3c structure -->
    <div style="position:absolute; left:260px; bottom:240px; display:flex; flex-direction:column; gap:40px; max-width:960px;">
      <div style="display:flex; flex-direction:column; gap:28px;">
        <div style="font-family:'Plus Jakarta Sans',sans-serif; font-weight:600; font-size:22px; letter-spacing:0.32em; text-transform:uppercase; color:rgba(242,240,233,0.42);">A book by Sonika Cottman</div>
        <div style="font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:300; font-size:148px; color:#f2f0e9; line-height:0.92; letter-spacing:-0.02em; white-space:nowrap;">Formless</div>
      </div>
      <div style="display:flex; flex-direction:column; gap:22px; max-width:720px;">
        <div style="width:56px; height:1.5px; background:rgba(242,240,233,0.28);"></div>
        <div style="font-family:'Plus Jakarta Sans',sans-serif; font-weight:600; font-size:24px; letter-spacing:0.26em; text-transform:uppercase; color:#cc5833;">Arriving September 1, 2026</div>
        <div style="font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:300; font-size:44px; color:rgba(242,240,233,0.58); line-height:1.2; letter-spacing:0.01em; white-space:nowrap;">Something is arriving.</div>
      </div>
    </div>
  </div>
</body>
</html>
