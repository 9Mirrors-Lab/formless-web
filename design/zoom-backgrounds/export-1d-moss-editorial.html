<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Export 1d Moss Editorial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; background: #000; }
    .grain {
      position: absolute;
      inset: 0;
      background-image: url("./assets/grain.png");
      background-size: 400px 400px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!--
    THESIS: Moss editorial pillar; Chapter One line + Formless book meta from site hero aside.
    OWN-WORLD: Moss #2e4036, charcoal person field, cream type, clay accent, Eyes Closed mark.
    STORY: Teaching line uses the column width; bottom names Formless as the book arriving Sept 1.
    FIRST VIEWPORT: Arc + Eyes Closed; two-line italic (nowrap); Formless serif + date + invitation.
    FORM: Site patterns — hero book aside hierarchy, clay rule / quote edge, doorway invitation.
  -->
  <div id="export" style="position:relative; width:3840px; height:2160px; overflow:hidden; display:flex; background:#080a09;">
    <div class="grain" style="opacity:0.1; mix-blend-mode:soft-light; z-index:4;"></div>

    <!-- Left pillar — wide enough for two nowrap teaching lines -->
    <div style="position:relative; width:1380px; height:100%; flex-shrink:0; background:#2e4036; overflow:hidden; z-index:2;">
      <div style="position:absolute; inset:0; background:radial-gradient(90% 55% at 50% 0%, rgba(159,181,170,0.18) 0%, transparent 70%);"></div>

      <!-- Brand: quiet top lockup -->
      <div style="position:absolute; top:128px; left:108px; display:flex; flex-direction:column; gap:20px;">
        <img src="./assets/logo/eyes-closed-logo-arc-white.svg" alt="" style="width:340px; height:auto; display:block;">
        <span style="font-family:'Cormorant Garamond',Georgia,serif; font-weight:400; font-size:52px; color:rgba(242,240,233,0.88); line-height:1; letter-spacing:0.02em;">Eyes Closed</span>
      </div>

      <!-- Teaching line: exact two-line break, no mid-phrase wrap -->
      <div style="position:absolute; left:108px; top:500px; display:flex; flex-direction:column; gap:8px;">
        <div style="font-family:'Cormorant Garamond',Georgia,serif; font-style:italic; font-weight:300; font-size:92px; color:#f2f0e9; line-height:1.08; letter-spacing:-0.012em; white-space:nowrap;">
          What you’re searching for
        </div>
        <div style="font-family:'Cormorant Garamond',Georgia,serif; font-style:italic; font-weight:300; font-size:92px; color:#f2f0e9; line-height:1.08; letter-spacing:-0.012em; white-space:nowrap;">
          has never been missing.
        </div>
      </div>

      <!-- Formless meta: mirrors site hero book aside -->
      <div style="position:absolute; left:108px; bottom:140px; right:100px; display:flex; flex-direction:column; gap:0;">
        <div style="width:80px; height:3px; background:#cc5833; margin-bottom:36px;"></div>

        <div style="display:flex; flex-direction:column; gap:18px; border-left:3px solid rgba(204,88,51,0.45); padding-left:36px;">
          <div style="font-family:'Cormorant Garamond',Georgia,serif; font-weight:400; font-size:64px; letter-spacing:0.1em; text-transform:uppercase; color:#f2f0e9; line-height:1;">Formless</div>

          <div style="font-family:'Plus Jakarta Sans',system-ui,sans-serif; font-weight:600; font-size:24px; letter-spacing:0.22em; text-transform:uppercase; color:#cc5833; line-height:1.35;">
            Coming September 1, 2026
          </div>

          <div style="font-family:'Cormorant Garamond',Georgia,serif; font-weight:400; font-style:italic; font-size:36px; color:rgba(242,240,233,0.62); line-height:1.35; max-width:980px; letter-spacing:0.01em;">
            An invitation to discover who you are beyond thought
          </div>

          <div style="font-family:'Plus Jakarta Sans',system-ui,sans-serif; font-weight:500; font-size:22px; letter-spacing:0.16em; text-transform:uppercase; color:rgba(242,240,233,0.36); line-height:1.4; margin-top:8px;">
            A book by Sonika Cottman
          </div>
        </div>
      </div>
    </div>

    <!-- Person field — quiet charcoal only -->
    <div style="flex:1; position:relative; background:
      radial-gradient(ellipse 55% 45% at 62% 28%, rgba(159,181,170,0.07) 0%, transparent 70%),
      radial-gradient(ellipse 80% 60% at 50% 100%, rgba(46,64,54,0.18) 0%, transparent 55%),
      #080a09; overflow:hidden;">
    </div>
  </div>
</body>
</html>
