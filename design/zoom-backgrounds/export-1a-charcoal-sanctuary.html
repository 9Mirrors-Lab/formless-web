<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Export 1a Charcoal Sanctuary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; background: #000; }
    .grain {
      position: absolute;
      inset: 0;
      background-image: url("./assets/grain.png");
      background-size: 400px 400px;
      pointer-events: none;
    }
    .eyebrow {
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      text-transform: uppercase;
      font-weight: 600;
    }
    .teach {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-style: italic;
      font-weight: 300;
      line-height: 1.2;
    }
  </style>
</head>
<body>
  <!-- Branding stays in left safe zone; center kept clear for head & shoulders -->
  <div id="export" style="position:relative; width:3840px; height:2160px; overflow:hidden; background:
    radial-gradient(circle at 14% 10%, rgba(204,88,51,0.08) 0%, rgba(204,88,51,0.015) 22%, rgba(8,10,9,0) 40%),
    radial-gradient(circle at 86% 16%, rgba(159,181,170,0.12) 0%, rgba(159,181,170,0.02) 20%, rgba(8,10,9,0) 40%),
    #080a09;">
    <div class="grain" style="opacity:0.1; mix-blend-mode:soft-light;"></div>
    <div style="position:absolute; inset:128px; border:2px solid rgba(242,240,233,0.1); border-radius:40px;"></div>

    <div style="position:absolute; top:260px; left:260px; display:flex; flex-direction:column; align-items:flex-start; gap:10px; max-width:980px;">
      <img src="./assets/logo/eyes-closed-logo-white.svg" alt="Eyes Closed" style="width:672px; height:auto;">
    </div>

    <div style="position:absolute; left:260px; bottom:260px; max-width:1100px; display:flex; flex-direction:column; gap:28px;">
      <div class="eyebrow" style="font-size:28px; letter-spacing:0.28em; color:#cc5833;">Formless</div>
      <div class="teach" style="font-size:64px; color:rgba(242,240,233,0.88);">An invitation to discover<br>who you are beyond thought.</div>
    </div>
  </div>
</body>
</html>
