<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Export 2b Ghost Type v2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; background: #000; }
    .grain { position:absolute; inset:0; background-image:url("./assets/grain.png"); background-size:400px 400px; pointer-events:none; }
    .type {
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      font-style: normal;
      text-shadow: 0 2px 12px rgba(0,0,0,0.7), 0 0 30px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>
  <div id="export" style="position:relative; width:3840px; height:2160px; overflow:hidden; background:#080a09;">
    <div class="grain" style="opacity:0.08; mix-blend-mode:soft-light;"></div>
    <div style="position:absolute; top:50%; right:-120px; transform:translateY(-50%); font-family:'Plus Jakarta Sans',sans-serif; font-style:normal; font-weight:800; font-size:640px; color:#f2f0e9; opacity:0.05; line-height:1; letter-spacing:-0.02em; white-space:nowrap; pointer-events:none; text-transform:uppercase;">Formless</div>
    <div style="position:absolute; top:0; left:0; width:42%; height:100%; background:linear-gradient(90deg, rgba(8,10,9,0.96) 60%, rgba(8,10,9,0) 100%);"></div>

    <div style="position:absolute; top:220px; left:260px; display:flex; flex-direction:column; align-items:flex-start; max-width:1040px;">
      <img src="./assets/logo/eyes-closed-logo-white.svg" alt="Eyes Closed" style="width:504px; height:auto; display:block; filter:drop-shadow(0 4px 18px rgba(0,0,0,0.55));">

      <div style="margin-top:305px; display:flex; flex-direction:column; gap:36px;">
        <div style="display:flex; flex-direction:column; gap:22px;">
          <div class="type" style="font-weight:700; font-size:26px; letter-spacing:0.08em; text-transform:uppercase; color:rgba(242,240,233,0.48);">A book by Sonika Cottman</div>
          <div class="type" style="font-weight:800; font-size:140px; color:#f2f0e9; line-height:0.95; letter-spacing:0.02em; text-transform:uppercase; white-space:nowrap;">Formless</div>
        </div>
        <div style="display:flex; flex-direction:column; gap:20px; max-width:820px;">
          <div style="width:56px; height:2px; background:rgba(242,240,233,0.32);"></div>
          <div class="type" style="font-weight:700; font-size:30px; letter-spacing:0.08em; text-transform:uppercase; color:#cc5833;">Arriving September 1, 2026</div>
          <div class="type" style="font-weight:600; font-size:42px; color:rgba(242,240,233,0.7); line-height:1.2; letter-spacing:0;">Something is arriving.</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
