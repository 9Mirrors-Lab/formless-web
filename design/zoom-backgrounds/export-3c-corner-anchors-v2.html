<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Export 3c Corner Anchors v2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; background: #000; }
    .grain { position:absolute; inset:0; background-image:url("./assets/grain.png"); background-size:400px 400px; pointer-events:none; }
    .type {
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      font-style: normal;
      text-shadow: 0 2px 14px rgba(0,0,0,0.78), 0 0 34px rgba(0,0,0,0.48);
    }
  </style>
</head>
<body>
  <div id="export" style="position:relative; width:3840px; height:2160px; overflow:hidden; background:#080a09;">
    <img src="./assets/imagery/misty-river.jpg" alt="" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0.5;">
    <div style="position:absolute; inset:0; background:radial-gradient(ellipse 100% 100% at 50% 50%, rgba(8,10,9,0) 0%, rgba(8,10,9,0.7) 100%);"></div>
    <div style="position:absolute; inset:0; background:linear-gradient(90deg, rgba(8,10,9,0.5) 0%, rgba(8,10,9,0) 28%, rgba(8,10,9,0) 72%, rgba(8,10,9,0.65) 100%);"></div>
    <div class="grain" style="opacity:0.08; mix-blend-mode:soft-light;"></div>

    <div style="position:absolute; top:144px; left:160px; display:flex; align-items:center; gap:28px;">
      <img src="./assets/logo/eyes-closed-logo-white.svg" alt="Eyes Closed" style="width:456px; height:auto; filter:drop-shadow(0 4px 18px rgba(0,0,0,0.55));">
    </div>

    <div style="position:absolute; right:140px; top:0; bottom:0; width:1000px; display:flex; flex-direction:column; justify-content:center; gap:36px; padding-left:88px; border-left:2px solid rgba(242,240,233,0.18);">
      <div style="display:flex; flex-direction:column; gap:22px;">
        <div class="type" style="font-weight:700; font-size:26px; letter-spacing:0.08em; text-transform:uppercase; color:rgba(242,240,233,0.5);">A book by Sonika Cottman</div>
        <div class="type" style="font-weight:800; font-size:132px; color:#f2f0e9; line-height:0.95; letter-spacing:0.02em; text-transform:uppercase; white-space:nowrap;">Formless</div>
      </div>
      <div style="display:flex; flex-direction:column; gap:20px; max-width:820px;">
        <div style="width:56px; height:2px; background:rgba(242,240,233,0.32);"></div>
        <div class="type" style="font-weight:700; font-size:30px; letter-spacing:0.08em; text-transform:uppercase; color:#cc5833;">Arriving September 1, 2026</div>
        <div class="type" style="font-weight:600; font-size:40px; color:rgba(242,240,233,0.72); line-height:1.2; letter-spacing:0;">A book on remembering who you are.</div>
      </div>
    </div>

    <div style="position:absolute; bottom:144px; left:160px;">
      <div class="type" style="font-weight:700; font-size:28px; letter-spacing:0.08em; text-transform:uppercase; color:rgba(242,240,233,0.42);">eyesclosed.com</div>
    </div>
  </div>
</body>
</html>
