<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Export 4b Frequency Pillar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; background: #000; }
    .grain {
      position: absolute; inset: 0;
      background-image: url("./assets/grain.png");
      background-size: 400px 400px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!--
    4b Frequency Pillar — DIFFERENT from side waveform sticker.
    FrequencyOfMindVisual becomes a full-height LEFT architectural pillar
    (same family as moss editorial / left pillar plates). Person stands in
    the open cream/charcoal field. Exact FoM bars + exact ekg path.
  -->
  <div id="export" style="position:relative; width:3840px; height:2160px; overflow:hidden; display:flex; background:#f2f0e9;">
    <div class="grain" style="opacity:0.06; mix-blend-mode:multiply; z-index:5;"></div>

    <!-- LEFT PILLAR — FoM as architecture -->
    <div style="position:relative; width:1280px; height:100%; flex-shrink:0; background:#1a2520; overflow:hidden; z-index:2;">
      <div style="position:absolute; inset:0; background:radial-gradient(ellipse 80% 50% at 50% 0%, rgba(159,181,170,0.16) 0%, transparent 70%);"></div>

      <!-- Exact FrequencyOfMindVisual: 42 bars, clay every 7th -->
      <svg viewBox="0 0 1280 2160" width="1280" height="2160" style="position:absolute; inset:0;" aria-hidden="true">
        <!-- FoM ambient -->
        <defs>
          <radialGradient id="fomGlow" cx="50%" cy="45%" r="55%">
            <stop offset="0%" stop-color="rgba(155,183,168,0.18)"/>
            <stop offset="100%" stop-color="rgba(155,183,168,0)"/>
          </radialGradient>
        </defs>
        <rect width="1280" height="2160" fill="url(#fomGlow)"/>

        <!--
          Native FoM: x=50+i*10, y=100, w=2, h=450 in 520×650
          Remap into pillar: translate(140, 280) scale(2.1, 3.4)
          Mid-breath scaleY 0.62 for presence without filling person spill
        -->
        <g transform="translate(140 200) scale(2.15 3.5)">
          <g transform="translate(0 325) scale(1 0.72) translate(0 -325)">
            <rect x="50" y="100" width="2.5" height="450" rx="1.2" fill="#9FB5AA" opacity="0.45"/>
            <rect x="60" y="100" width="2.5" height="450" rx="1.2" fill="#9FB5AA" opacity="0.45"/>
            <rect x="70" y="100" width="2.5" height="450" rx="1.2" fill="#9FB5AA" opacity="0.45"/>
            <rect x="80" y="100" width="2.5" height="450" rx="1.2" fill="#9FB5AA" opacity="0.45"/>
            <rect x="90" y="100" width="2.5" height="450" rx="1.2" fill="#9FB5AA" opacity="0.45"/>
            <rect x="100" y="100" width="2.5" height="450" rx="1.2" fill="#9FB5AA" opacity="0.45"/>
            <rect x="110" y="100" width="2.5" height="450" rx="1.2" fill="#CC5833" opacity="0.75"/>
            <rect x="120" y="100" width="2.5" height="450" rx="1.2" fill="#9FB5AA" opacity="0.45"/>
            <rect x="130" y="100" width="2.5" height="450" rx="1.2" fill="#9FB5AA" opacity="0.45"/>
            <rect x="140" y="100" width="2.5" height="450" rx="1.2" fill="#9FB5AA" opacity="0.45"/>
            <rect x="150" y="100" width="2.5" height="450" rx="1.2" fill="#9FB5AA" opacity="0.45"/>
            <rect x="160" y="100" width="2.5" height="450" rx="1.2" fill="#9FB5AA" opacity="0.45"/>
            <rect x="170" y="100" width="2.5" height="450" rx="1.2" fill="#9FB5AA" opacity="0.45"/>
            <rect x="180" y="100" width="2.5" height="450" rx="1.2" fill="#CC5833" opacity="0.75"/>
            <rect x="190" y="100" width="2.5" height="450" rx="1.2" fill="#9FB5AA" opacity="0.45"/>
            <rect x="200" y="100" width="2.5" height="450" rx="1.2" fill="#9FB5AA" opacity="0.45"/>
            <rect x="210" y="100" width="2.5" height="450" rx="1.2" fill="#9FB5AA" opacity="0.45"/>
            <rect x="220" y="100" width="2.5" height="450" rx="1.2" fill="#9FB5AA" opacity="0.45"/>
            <rect x="230" y="100" width="2.5" height="450" rx="1.2" fill="#9FB5AA" opacity="0.45"/>
            <rect x="240" y="100" width="2.5" height="450" rx="1.2" fill="#9FB5AA" opacity="0.45"/>
            <rect x="250" y="100" width="2.5" height="450" rx="1.2" fill="#CC5833" opacity="0.75"/>
            <rect x="260" y="100" width="2.5" height="450" rx="1.2" fill="#9FB5AA" opacity="0.45"/>
            <rect x="270" y="100" width="2.5" height="450" rx="1.2" fill="#9FB5AA" opacity="0.45"/>
            <rect x="280" y="100" width="2.5" height="450" rx="1.2" fill="#9FB5AA" opacity="0.45"/>
            <rect x="290" y="100" width="2.5" height="450" rx="1.2" fill="#9FB5AA" opacity="0.45"/>
            <rect x="300" y="100" width="2.5" height="450" rx="1.2" fill="#9FB5AA" opacity="0.45"/>
            <rect x="310" y="100" width="2.5" height="450" rx="1.2" fill="#9FB5AA" opacity="0.45"/>
            <rect x="320" y="100" width="2.5" height="450" rx="1.2" fill="#CC5833" opacity="0.75"/>
            <rect x="330" y="100" width="2.5" height="450" rx="1.2" fill="#9FB5AA" opacity="0.45"/>
            <rect x="340" y="100" width="2.5" height="450" rx="1.2" fill="#9FB5AA" opacity="0.45"/>
            <rect x="350" y="100" width="2.5" height="450" rx="1.2" fill="#9FB5AA" opacity="0.45"/>
            <rect x="360" y="100" width="2.5" height="450" rx="1.2" fill="#9FB5AA" opacity="0.45"/>
            <rect x="370" y="100" width="2.5" height="450" rx="1.2" fill="#9FB5AA" opacity="0.45"/>
            <rect x="380" y="100" width="2.5" height="450" rx="1.2" fill="#9FB5AA" opacity="0.45"/>
            <rect x="390" y="100" width="2.5" height="450" rx="1.2" fill="#CC5833" opacity="0.75"/>
            <rect x="400" y="100" width="2.5" height="450" rx="1.2" fill="#9FB5AA" opacity="0.45"/>
            <rect x="410" y="100" width="2.5" height="450" rx="1.2" fill="#9FB5AA" opacity="0.45"/>
            <rect x="420" y="100" width="2.5" height="450" rx="1.2" fill="#9FB5AA" opacity="0.45"/>
            <rect x="430" y="100" width="2.5" height="450" rx="1.2" fill="#9FB5AA" opacity="0.45"/>
            <rect x="440" y="100" width="2.5" height="450" rx="1.2" fill="#9FB5AA" opacity="0.45"/>
            <rect x="450" y="100" width="2.5" height="450" rx="1.2" fill="#9FB5AA" opacity="0.45"/>
            <rect x="460" y="100" width="2.5" height="450" rx="1.2" fill="#CC5833" opacity="0.75"/>
          </g>
        </g>

        <!-- Exact ekg Vital trace across mid pillar -->
        <g transform="translate(80 1080) scale(5.6 3.2)">
          <path d="M0 10 H200 M0 20 H200 M0 30 H200 M0 40 H200 M0 50 H200" stroke="rgba(242,240,233,0.08)" stroke-width="1" fill="none"/>
          <path d="M0 30 H30 L40 10 L50 50 L65 5 L80 30 H200" fill="none" stroke="#cc5833" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
        </g>
      </svg>

      <!-- Brand in pillar -->
      <div style="position:absolute; top:120px; left:96px; display:flex; flex-direction:column; gap:16px; z-index:3;">
        <img src="./assets/logo/eyes-closed-logo-arc-white.svg" alt="" style="width:340px; height:auto; display:block;">
        <span style="font-family:'Cormorant Garamond',serif; font-weight:400; font-size:44px; color:rgba(242,240,233,0.88);">Eyes Closed</span>
      </div>

      <!-- Lockup at pillar foot -->
      <div style="position:absolute; left:96px; bottom:140px; display:flex; flex-direction:column; gap:20px; z-index:3; max-width:1000px;">
        <div style="font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:48px; color:#f2f0e9;">Sonika Cottman</div>
        <div style="width:160px; height:2px; background:rgba(242,240,233,0.4);"></div>
        <div style="font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:300; font-size:72px; color:#f2f0e9; line-height:0.95;">Formless</div>
        <div style="font-family:'Plus Jakarta Sans',sans-serif; font-weight:600; font-size:20px; letter-spacing:0.24em; text-transform:uppercase; color:#cc5833;">Frequency of Mind</div>
      </div>
    </div>

    <!-- RIGHT — open person field -->
    <div style="flex:1; position:relative; background:#f2f0e9; overflow:hidden;">
      <div style="position:absolute; inset:0; background:radial-gradient(ellipse 70% 60% at 30% 40%, rgba(46,64,54,0.06) 0%, transparent 70%);"></div>
      <!-- Faint ghost F, intentionally behind person -->
      <div style="position:absolute; right:-60px; bottom:-80px; font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:300; font-size:780px; color:rgba(46,64,54,0.05); line-height:1; pointer-events:none;">F</div>
    </div>
  </div>
</body>
</html>
