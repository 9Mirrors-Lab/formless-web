<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Export 2c Golden Coast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; background: #000; }
    .grain { position:absolute; inset:0; background-image:url("./assets/grain.png"); background-size:400px 400px; pointer-events:none; }
  </style>
</head>
<body>
  <div id="export" style="position:relative; width:3840px; height:2160px; overflow:hidden; background:#1a0e08;">
    <img src="./assets/imagery/sunset-coast.jpg" alt="" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover;">
    <div style="position:absolute; inset:0; background:linear-gradient(180deg, rgba(8,6,4,0.82) 0%, rgba(8,6,4,0.2) 22%, rgba(8,6,4,0.05) 50%, rgba(8,6,4,0.45) 100%);"></div>
    <div class="grain" style="opacity:0.08; mix-blend-mode:soft-light;"></div>

    <div style="position:absolute; top:0; left:0; right:0; height:420px; display:flex; align-items:center; padding:0 260px;">
      <div style="display:flex; align-items:center; gap:36px; flex:1;">
        <img src="./assets/logo/eyes-closed-logo-white.svg" alt="Eyes Closed" style="width:624px; height:auto;">
      </div>
      <div style="display:flex; flex-direction:column; align-items:flex-end; gap:14px;">
        <div style="font-family:'Plus Jakarta Sans',sans-serif; font-weight:600; font-size:32px; letter-spacing:0.28em; text-transform:uppercase; color:rgba(242,240,233,0.55);">A book by Sonika Cottman</div>
        <div style="font-family:'Plus Jakarta Sans',sans-serif; font-weight:600; font-size:34px; letter-spacing:0.28em; text-transform:uppercase; color:#cc5833;">Formless · Arriving September 1</div>
      </div>
    </div>

    <div style="position:absolute; bottom:220px; right:260px; max-width:1400px; text-align:right;">
      <div style="font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:300; font-size:80px; color:rgba(242,240,233,0.9); line-height:1.15;">Formless takes you within to<br>discover what exists beyond your thoughts.</div>
    </div>
  </div>
</body>
</html>
