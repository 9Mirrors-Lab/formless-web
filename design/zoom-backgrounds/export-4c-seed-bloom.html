<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Export 4c Horizon Bloom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; background: #000; }
    .grain {
      position: absolute; inset: 0;
      background-image: url("./assets/grain.png");
      background-size: 400px 400px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!--
    4c Horizon Bloom — DIFFERENT from right-side Seed sticker.
    Exact Seed of Life from teachingIcons as a luminous HORIZON / ground plane
    across the full bottom of the frame, fading upward into the person zone.
    Molecule + quantum as secondary marks in the bloom. Speaker stands above it.
  -->
  <div id="export" style="position:relative; width:3840px; height:2160px; overflow:hidden; background:#080a09;">
    <div class="grain" style="opacity:0.08; mix-blend-mode:soft-light;"></div>

    <!-- Sky wash -->
    <div style="position:absolute; inset:0; background:radial-gradient(ellipse 100% 55% at 50% 0%, rgba(26,35,50,0.9) 0%, #080a09 70%);"></div>
    <div style="position:absolute; inset:0; background:radial-gradient(ellipse 80% 45% at 50% 100%, rgba(159,181,170,0.1) 0%, transparent 60%);"></div>
    <div style="position:absolute; inset:0; background:radial-gradient(ellipse 50% 35% at 50% 85%, rgba(204,88,51,0.08) 0%, transparent 55%);"></div>

    <svg viewBox="0 0 3840 2160" width="3840" height="2160" style="position:absolute; inset:0;" aria-hidden="true">
      <!-- Soft bloom glow under the seed field -->
      <ellipse cx="1920" cy="1880" rx="1600" ry="420" fill="rgba(204,88,51,0.06)"/>
      <ellipse cx="1920" cy="1920" rx="1200" ry="280" fill="rgba(159,181,170,0.07)"/>

      <!--
        Exact Seed of Life — teachingIcons centers/lenses/sparks
        Large, sitting as horizon: center near bottom third
        Scale 18, origin so (40,50) lands at (1920, 1720)
        translate(1920 - 40*18, 1720 - 50*18) = (1200, 820)
      -->
      <g transform="translate(1200 820) scale(18)" opacity="0.92">
        <defs>
          <clipPath id="hb-c1"><circle cx="40" cy="50" r="20"/></clipPath>
          <clipPath id="hb-c2"><circle cx="60" cy="50" r="20"/></clipPath>
          <clipPath id="hb-c3"><circle cx="50" cy="32.68" r="20"/></clipPath>
          <clipPath id="hb-c4"><circle cx="50" cy="67.32" r="20"/></clipPath>
          <clipPath id="hb-c5"><circle cx="30" cy="32.68" r="20"/></clipPath>
          <clipPath id="hb-c6"><circle cx="30" cy="67.32" r="20"/></clipPath>
        </defs>

        <!-- Exact lenses -->
        <circle cx="60" cy="50" r="20" fill="#cc5833" stroke="none" opacity="0.5" clip-path="url(#hb-c1)"/>
        <circle cx="50" cy="32.68" r="20" fill="#cc5833" stroke="none" opacity="0.5" clip-path="url(#hb-c1)"/>
        <circle cx="50" cy="67.32" r="20" fill="#cc5833" stroke="none" opacity="0.5" clip-path="url(#hb-c1)"/>
        <circle cx="30" cy="32.68" r="20" fill="#cc5833" stroke="none" opacity="0.42" clip-path="url(#hb-c1)"/>
        <circle cx="30" cy="67.32" r="20" fill="#cc5833" stroke="none" opacity="0.42" clip-path="url(#hb-c1)"/>
        <circle cx="20" cy="50" r="20" fill="#cc5833" stroke="none" opacity="0.42" clip-path="url(#hb-c1)"/>
        <circle cx="50" cy="32.68" r="20" fill="#cc5833" stroke="none" opacity="0.32" clip-path="url(#hb-c2)"/>
        <circle cx="50" cy="67.32" r="20" fill="#cc5833" stroke="none" opacity="0.32" clip-path="url(#hb-c2)"/>
        <circle cx="30" cy="32.68" r="20" fill="#cc5833" stroke="none" opacity="0.28" clip-path="url(#hb-c3)"/>
        <circle cx="30" cy="67.32" r="20" fill="#cc5833" stroke="none" opacity="0.28" clip-path="url(#hb-c4)"/>
        <circle cx="20" cy="50" r="20" fill="#cc5833" stroke="none" opacity="0.28" clip-path="url(#hb-c5)"/>
        <circle cx="20" cy="50" r="20" fill="#cc5833" stroke="none" opacity="0.28" clip-path="url(#hb-c6)"/>

        <g fill="none" stroke="rgba(242,240,233,0.38)" stroke-width="1.6">
          <circle cx="40" cy="50" r="20"/>
          <circle cx="60" cy="50" r="20"/>
          <circle cx="50" cy="32.68" r="20"/>
          <circle cx="50" cy="67.32" r="20"/>
          <circle cx="30" cy="32.68" r="20"/>
          <circle cx="30" cy="67.32" r="20"/>
          <circle cx="20" cy="50" r="20"/>
        </g>

        <g fill="#cc5833" stroke="none">
          <circle cx="40" cy="50" r="2.25"/>
          <circle cx="60" cy="50" r="2.25"/>
          <circle cx="50" cy="32.68" r="2.25"/>
          <circle cx="50" cy="67.32" r="2.25"/>
          <circle cx="30" cy="32.68" r="2.25"/>
          <circle cx="30" cy="67.32" r="2.25"/>
          <circle cx="20" cy="50" r="2.25"/>
        </g>
      </g>

      <!-- Side seed echoes — widen the horizon left/right (same geometry, smaller) -->
      <g transform="translate(180 1100) scale(9)" opacity="0.28">
        <g fill="none" stroke="rgba(242,240,233,0.4)" stroke-width="2">
          <circle cx="40" cy="50" r="20"/><circle cx="60" cy="50" r="20"/>
          <circle cx="50" cy="32.68" r="20"/><circle cx="50" cy="67.32" r="20"/>
          <circle cx="30" cy="32.68" r="20"/><circle cx="30" cy="67.32" r="20"/>
          <circle cx="20" cy="50" r="20"/>
        </g>
        <circle cx="40" cy="50" r="2" fill="#cc5833"/><circle cx="60" cy="50" r="2" fill="#cc5833"/>
        <circle cx="50" cy="32.68" r="2" fill="#cc5833"/><circle cx="50" cy="67.32" r="2" fill="#cc5833"/>
        <circle cx="30" cy="32.68" r="2" fill="#cc5833"/><circle cx="30" cy="67.32" r="2" fill="#cc5833"/>
        <circle cx="20" cy="50" r="2" fill="#cc5833"/>
      </g>
      <g transform="translate(2920 1100) scale(9)" opacity="0.28">
        <g fill="none" stroke="rgba(242,240,233,0.4)" stroke-width="2">
          <circle cx="40" cy="50" r="20"/><circle cx="60" cy="50" r="20"/>
          <circle cx="50" cy="32.68" r="20"/><circle cx="50" cy="67.32" r="20"/>
          <circle cx="30" cy="32.68" r="20"/><circle cx="30" cy="67.32" r="20"/>
          <circle cx="20" cy="50" r="20"/>
        </g>
        <circle cx="40" cy="50" r="2" fill="#cc5833"/><circle cx="60" cy="50" r="2" fill="#cc5833"/>
        <circle cx="50" cy="32.68" r="2" fill="#cc5833"/><circle cx="50" cy="67.32" r="2" fill="#cc5833"/>
        <circle cx="30" cy="32.68" r="2" fill="#cc5833"/><circle cx="30" cy="67.32" r="2" fill="#cc5833"/>
        <circle cx="20" cy="50" r="2" fill="#cc5833"/>
      </g>

      <!-- Exact molecule ghost, floating above left bloom -->
      <g transform="translate(520 1280) scale(5.5)" opacity="0.28" fill="none" stroke="#cc5833" stroke-width="2">
        <polygon points="50,20 76,35 76,65 50,80 24,65 24,35" stroke-dasharray="4 4"/>
        <line x1="50" y1="20" x2="50" y2="50"/>
        <line x1="24" y1="65" x2="50" y2="50"/>
        <line x1="76" y1="65" x2="50" y2="50"/>
        <circle cx="50" cy="20" r="4" fill="#cc5833" stroke="none"/>
        <circle cx="76" cy="35" r="4" fill="#cc5833" stroke="none"/>
        <circle cx="76" cy="65" r="4" fill="#cc5833" stroke="none"/>
        <circle cx="50" cy="80" r="4" fill="#cc5833" stroke="none"/>
        <circle cx="24" cy="65" r="4" fill="#cc5833" stroke="none"/>
        <circle cx="24" cy="35" r="4" fill="#cc5833" stroke="none"/>
        <circle cx="50" cy="50" r="8" fill="rgba(204,88,51,0.3)" stroke="none"/>
      </g>

      <!-- Exact quantum rings above right bloom -->
      <g transform="translate(3180 1380) scale(5.5)" opacity="0.32" fill="none" stroke="#9fb5aa" stroke-width="1.5">
        <circle cx="50" cy="50" r="40" stroke-dasharray="10 15 30 10" stroke="rgba(204,88,51,0.8)"/>
        <circle cx="50" cy="50" r="30" stroke-dasharray="20 10 5 15"/>
        <circle cx="50" cy="50" r="20" stroke-dasharray="5 5"/>
        <circle cx="50" cy="50" r="6" fill="#9fb5aa" stroke="none"/>
        <path d="M 50 20 L 50 30 M 50 70 L 50 80 M 20 50 L 30 50 M 70 50 L 80 50" stroke-width="2"/>
      </g>

      <!-- Horizon hairline -->
      <line x1="200" y1="1480" x2="3640" y2="1480" stroke="rgba(242,240,233,0.12)" stroke-width="1.5"/>
    </svg>

    <!-- Fade bloom so it sits under the person, not on the face -->
    <div style="position:absolute; left:0; right:0; top:0; height:62%; background:linear-gradient(180deg, #080a09 0%, #080a09 55%, rgba(8,10,9,0) 100%); pointer-events:none;"></div>

    <!-- Top brand band -->
    <div style="position:absolute; top:160px; left:220px; right:220px; display:flex; align-items:center; justify-content:space-between; z-index:3;">
      <div style="display:flex; align-items:center; gap:28px;">
        <img src="./assets/logo/eyes-closed-logo-arc-white.svg" alt="" style="width:340px; height:auto; display:block;">
        <span style="font-family:'Cormorant Garamond',serif; font-weight:400; font-size:48px; color:rgba(242,240,233,0.88);">Eyes Closed</span>
      </div>
      <div style="display:flex; flex-direction:column; align-items:flex-end; gap:10px;">
        <div style="font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:300; font-size:56px; color:#f2f0e9;">Formless</div>
        <div style="font-family:'Plus Jakarta Sans',sans-serif; font-weight:600; font-size:18px; letter-spacing:0.26em; text-transform:uppercase; color:#cc5833;">Seed of Life</div>
      </div>
    </div>

    <!-- Name lockup — mid-left, above the horizon so it clears the bloom -->
    <div style="position:absolute; left:220px; top:920px; display:flex; flex-direction:column; gap:16px; z-index:3;">
      <div style="font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:52px; color:#f2f0e9;">Sonika Cottman</div>
      <div style="width:160px; height:2px; background:rgba(242,240,233,0.4);"></div>
      <div style="font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:300; font-size:40px; color:rgba(242,240,233,0.7);">Formless</div>
    </div>
  </div>
</body>
</html>
